<!DOCTYPE html>
<html lang="en" data-theme="spotify">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart Spotify</title>
    <script>
      (function () {
        try {
          var source =
            localStorage.getItem("smart_spotify_auth_source") === "youtube"
              ? "youtube"
              : "spotify";
          var mode = localStorage.getItem("smart_spotify_color_mode");
          var isDark =
            mode === "dark" ||
            (mode !== "light" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.setAttribute(
            "data-theme",
            isDark ? source : source + "-light",
          );
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
